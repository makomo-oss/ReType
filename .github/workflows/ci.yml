name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ReType.slnx
      - name: Build
        run: dotnet build ReType.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/ReType.Tests -c Release --no-build
      - name: Build installer
        run: pwsh -File scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/ReType-Setup-*.exe
